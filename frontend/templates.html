<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Normal 템플릿 관리 - SH Rad Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>SH Rad Assistant</h1>
    <nav>
      <a href="index.html">판독 작성</a>
      <a href="templates.html" class="active">템플릿 관리</a>
      <a href="postprocessing.html">후처리 규칙</a>
    </nav>
  </header>

  <div class="template-layout">
    <div class="panel">
      <h2>템플릿 목록</h2>
      <ul id="template-list"></ul>
      <button id="new-template-btn" style="width: 100%; margin-top: 10px;">+ 새 템플릿</button>
      <div class="sync-row">
        <button id="sync-now-btn">다른 기기와 동기화</button>
        <span class="status-msg" id="sync-status"></span>
      </div>
    </div>

    <div class="panel">
      <h2>템플릿 편집</h2>
      <div class="form-row" style="flex-direction: row; gap: 12px;">
        <div style="flex: 1;">
          <label for="modality-select">Modality</label>
          <select id="modality-select" style="width: 100%;"></select>
        </div>
        <div style="flex: 1;">
          <label for="region-select">검사부위</label>
          <select id="region-select" style="width: 100%;"></select>
        </div>
      </div>

      <div class="form-row">
        <label for="title-input">제목</label>
        <input type="text" id="title-input" placeholder="예: CT Brain 표준 정상소견" />
      </div>

      <div class="form-row">
        <label for="findings-input">Findings</label>
        <textarea id="findings-input" placeholder="예: No acute intracranial hemorrhage. No definite space-occupying lesion..."></textarea>
      </div>

      <div class="form-row">
        <label for="conclusion-input">Conclusion</label>
        <textarea id="conclusion-input" style="min-height: 60px;" placeholder="예: No significant abnormality."></textarea>
      </div>

      <div class="form-row">
        <label for="seq-input">Seq</label>
        <textarea id="seq-input" style="min-height: 60px;" placeholder="예: 3P Localizer, SAG T2, SAG T1, SAG T2 STIR, AXL T2, AXL MERGE, Obl. SAG T2 RT, Obl. SAG T2 LT"></textarea>
      </div>

      <div class="actions-row">
        <button id="save-btn" class="primary">Save</button>
        <button id="delete-btn" class="danger">Delete</button>
      </div>
      <div class="status-msg" id="status-msg"></div>

      <div id="version-history"></div>
    </div>
  </div>

  <script type="module" src="js/template-manager.js"></script>
</body>
</html>

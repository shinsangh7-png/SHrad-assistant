<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>판독 작성 - SH Rad Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>SH Rad Assistant</h1>
    <nav>
      <a href="index.html" class="active">판독 작성</a>
      <a href="templates.html">템플릿 관리</a>
      <a href="postprocessing.html">후처리 규칙</a>
    </nav>
  </header>

  <div class="main-layout">
    <div class="panel">
      <button id="new-report-btn" class="primary" style="width: 100%; margin-bottom: 22px;">새 판독</button>

      <div class="form-row">
        <label>판독 모드</label>
        <div class="mode-toggle" id="report-mode-toggle">
          <button type="button" class="mode-toggle-btn active" data-mode="local">Local</button>
          <button type="button" class="mode-toggle-btn" data-mode="smc">SMC</button>
        </div>
      </div>

      <div class="form-row">
        <label for="modality-select">Modality</label>
        <select id="modality-select"></select>
      </div>
      <div class="form-row">
        <label for="region-select">검사부위</label>
        <select id="region-select"></select>
      </div>
      <div class="form-row">
        <label for="patient-context">Clinical information</label>
        <textarea id="patient-context" style="min-height: 70px;"></textarea>
        <button id="open-clinical-context-btn" style="width: 100%; margin-top: 4px;">Clinical Check Point</button>
      </div>
      <div class="form-row">
        <label for="previous-report">Previous report</label>
        <textarea id="previous-report" style="min-height: 110px;"></textarea>
      </div>

      <div class="form-row">
        <label>Templates</label>
        <ul id="template-list-inline" class="template-inline-list"></ul>
      </div>
    </div>

    <div class="panel">
      <h2>Findings</h2>
      <div class="mic-row">
        <button id="mic-toggle-btn" class="mic-btn" title="마이크 시작/정지">
          <span class="rec-dot"></span>
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/></svg>
        </button>
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" class="mode-toggle-btn active" data-mode="ko-en">Eng+Kor</button>
          <button type="button" class="mode-toggle-btn" data-mode="en">Eng</button>
        </div>
        <span class="status-msg" id="mic-status"></span>
      </div>
      <textarea id="findings-text" placeholder="마이크로 소견을 구술하거나 직접 입력하세요."></textarea>
      <div class="actions-row">
        <button id="correct-only-btn">Correction</button>
        <button id="generate-report-btn" class="primary">Generate Report</button>
      </div>
      <div class="status-msg" id="report-status"></div>

      <div class="ask-search-row">
        <input type="text" id="ask-question-input" />
        <button id="ask-submit-btn">검색</button>
      </div>
    </div>

    <div class="panel">
      <h2>Report</h2>
      <textarea id="full-report-text"></textarea>
      <div class="actions-row">
        <button id="copy-report-btn">복사</button>
        <span class="status-msg" id="copy-status"></span>
      </div>

      <div class="form-row" style="margin-top: 16px;">
        <label>Key images</label>
        <div id="key-images-dropzone" class="image-dropzone" tabindex="0">
          <span id="key-images-placeholder" class="dropzone-placeholder">클릭 후 Ctrl+V로 이미지 붙여넣기</span>
          <div id="key-images-preview" class="image-thumb-row"></div>
        </div>
      </div>

      <div class="actions-row" style="margin-top: 12px;">
        <button id="open-ddx-btn" style="flex: 1;">DDx</button>
        <button id="open-additional-btn" style="flex: 1;">Additional consideration</button>
      </div>
    </div>
  </div>

  <div id="checkpoints-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="checkpoints-modal-title">DDx</h2>
        <button id="close-checkpoints-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="status-msg" id="checkpoints-modal-status"></div>
      <div class="dual-panel">
        <div class="dual-col">
          <h3>Claude</h3>
          <div id="claude-checkpoints-content" class="placeholder-panel">불러오는 중...</div>
        </div>
        <div class="dual-col">
          <h3>Gemini</h3>
          <div id="gemini-checkpoints-content" class="placeholder-panel">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="clinical-context-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Clinical Check Point</h2>
        <button id="close-clinical-context-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="status-msg" id="clinical-context-modal-status"></div>
      <div class="dual-panel">
        <div class="dual-col">
          <h3>Claude</h3>
          <div id="claude-clinical-context-content" class="placeholder-panel">불러오는 중...</div>
        </div>
        <div class="dual-col">
          <h3>Gemini</h3>
          <div id="gemini-clinical-context-content" class="placeholder-panel">불러오는 중...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="ask-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Ask AI</h2>
        <button id="close-ask-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="status-msg" id="ask-modal-status"></div>
      <div class="dual-panel">
        <div class="dual-col">
          <div id="claude-ask-content" class="placeholder-panel"></div>
        </div>
        <div class="dual-col">
          <div id="gemini-ask-content" class="placeholder-panel"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/report-view.js"></script>
</body>
</html>

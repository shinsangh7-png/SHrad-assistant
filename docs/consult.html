<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Rad AI</title>
  <link rel="manifest" href="manifest-consult.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="consult-page">
    <div class="consult-header">
      <a class="action-sm" href="index.html" target="_blank" rel="noopener" title="판독/전사 앱을 새 창에서 열기">SH Rad 전사</a>
      <div class="consult-provider-tabs">
        <button class="consult-tab active" data-provider="gpt">GPT</button>
        <button class="consult-tab" data-provider="gemini">Gemini</button>
        <button class="consult-tab" data-provider="claude">Claude</button>
      </div>
      <select id="consult-conv-select" class="consult-conv-select"></select>
      <button id="consult-settings-btn" class="icon-btn" title="API 키 설정">⚙</button>
    </div>

    <div class="consult-body">
      <div class="consult-sidebar">
        <button id="consult-new-patient-btn" class="primary" style="width: 100%;">+ New Patient</button>
        <div id="consult-conversation-list" class="consult-conversation-list"></div>
      </div>

      <div class="consult-main">
        <div class="consult-toolbar">
          <input type="text" id="consult-model-input" class="consult-model-input" title="모델명 (직접 수정 가능)" />
          <button id="consult-ppt-btn" class="action-sm" title="이 환자 내용을 PPT 슬라이드로 요약">PPT</button>
        </div>
        <div id="consult-messages" class="consult-messages"></div>
        <div id="consult-attachments" class="consult-attachments"></div>
        <div class="consult-input-row">
          <button id="consult-attach-btn" class="action-sm" title="이미지 첨부">+이미지</button>
          <input type="file" id="consult-file-input" accept="image/*" multiple hidden />
          <textarea id="consult-input" placeholder="질문을 입력하세요 (이미지는 Ctrl+V로 붙여넣기 가능, Ctrl+Enter로 전송)"></textarea>
          <button id="consult-send-btn" class="primary">전송</button>
        </div>
        <div class="status-msg" id="consult-status"></div>
      </div>
    </div>
  </div>

  <div id="consult-settings-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>API 키 설정</h2>
        <button id="close-consult-settings-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="settings-field">
        <label for="consult-openai-key-input">OpenAI API Key</label>
        <input type="password" id="consult-openai-key-input" placeholder="sk-..." />
      </div>
      <div class="settings-field">
        <label for="consult-gemini-key-input">Gemini API Key</label>
        <input type="password" id="consult-gemini-key-input" placeholder="AIza..." />
      </div>
      <div class="settings-field">
        <label for="consult-anthropic-key-input">Anthropic API Key</label>
        <input type="password" id="consult-anthropic-key-input" placeholder="sk-ant-..." />
      </div>
      <div class="settings-note">이 브라우저에만 저장되며, 각 API로만 직접 전송됩니다. SH Rad 전사 앱과 이 키를 공유합니다.</div>
      <button id="save-consult-settings-btn" class="primary" style="width: 100%;">저장</button>
      <div class="status-msg" id="consult-settings-modal-status"></div>
    </div>
  </div>

  <div id="ppt-modal" class="modal-overlay hidden">
    <div class="modal-box modal-box-lg">
      <div class="modal-header">
        <h2>PPT 요약</h2>
        <button id="close-ppt-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="status-msg" id="ppt-modal-status"></div>
      <div id="ppt-slides-container"></div>
      <button id="ppt-copy-all-btn" class="action-sm" style="width: 100%; margin-top: 8px;">전체 복사</button>
    </div>
  </div>

  <script type="module" src="js/consult.js"></script>
</body>
</html>

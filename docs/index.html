<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>SH Rad</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="tab-transcribe">전사</button>
        <button type="button" class="tab-btn" data-tab="tab-rules">후처리 규칙</button>
      </div>
      <button id="settings-btn" class="icon-btn" title="설정">⚙</button>
    </header>

    <div id="tab-transcribe" class="tab-panel">
      <div class="mic-row">
        <button id="start-btn" class="mic-btn" title="전사 시작/정지 (클릭)">
          <span class="rec-dot"></span>
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/></svg>
        </button>
        <span class="hotkey-hint"><kbd id="hotkey-hint-key">F6</kbd> 시작 / 구간 나누기 (정지는 마이크 클릭)</span>
        <span class="status-msg" id="mic-status"></span>
      </div>

      <textarea id="transcript-text" placeholder="F6을 눌러 전사를 시작하세요."></textarea>

      <div class="action-row">
        <button id="correct-btn" class="primary action-main">Correction</button>
        <button id="check-btn" class="action-sm" title="감별진단 및 체크포인트 확인">Check</button>
        <button id="reset-btn" class="action-sm" title="내용 지우기">Reset</button>
      </div>
    </div>

    <div id="tab-rules" class="tab-panel hidden">
      <p class="rules-desc">교정(Correction) 완료 후 자동으로 적용되는 찾기/바꾸기 규칙입니다. 예: Left → Lt.</p>
      <div id="rules-list"></div>
      <button id="add-rule-btn" style="width: 100%; margin-top: 8px;">+ 새 규칙</button>
      <div class="status-msg" id="rules-status"></div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>설정</h2>
        <button id="close-settings-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="settings-field">
        <label for="theme-select">색상 테마</label>
        <select id="theme-select">
          <option value="pink">핑크 (기본)</option>
          <option value="gray">그레이</option>
          <option value="blue">파우더 블루</option>
          <option value="coral">코랄</option>
        </select>
      </div>
      <div class="settings-field">
        <label for="openai-key-input">OpenAI API Key (전사용)</label>
        <input type="password" id="openai-key-input" placeholder="sk-..." />
      </div>
      <div class="settings-field">
        <label for="stt-model-select">전사 모델</label>
        <select id="stt-model-select">
          <option value="gpt-4o-transcribe">gpt-4o-transcribe (기본)</option>
          <option value="whisper-1">whisper-1</option>
        </select>
      </div>
      <div class="settings-field">
        <label for="anthropic-key-input">Anthropic API Key (교정용)</label>
        <input type="password" id="anthropic-key-input" placeholder="sk-ant-..." />
      </div>
      <div class="settings-field">
        <label for="custom-terms-input">자주 쓰는 용어 (전사·교정 시 참고)</label>
        <textarea id="custom-terms-input" placeholder="쉼표로 구분: annular tear, hyperintensity, ..."></textarea>
      </div>
      <div class="settings-field">
        <label for="hotkey-input">단축키 (전사 시작 / 구간 나누기)</label>
        <input type="text" id="hotkey-input" placeholder="F6" readonly />
        <div class="settings-note" style="margin-top: 4px;">클릭 후 원하는 키를 누르세요. F1~F12 등 기능키를 추천합니다 (일반 타이핑과 안 겹침).</div>
      </div>
      <div class="settings-note">이 브라우저에만 저장되며, OpenAI/Anthropic API로만 직접 전송됩니다.</div>
      <button id="save-settings-btn" class="primary" style="width: 100%;">저장</button>
      <div class="status-msg" id="settings-modal-status"></div>
    </div>
  </div>

  <div id="check-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Check</h2>
        <button id="close-check-modal" class="modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="check-section">
        <div class="check-section-title">Differential Diagnosis</div>
        <ul id="check-ddx-list" class="check-list"></ul>
      </div>
      <div class="check-section">
        <div class="check-section-title">Check Points</div>
        <ul id="check-points-list" class="check-list"></ul>
      </div>
      <div class="status-msg" id="check-modal-status"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
